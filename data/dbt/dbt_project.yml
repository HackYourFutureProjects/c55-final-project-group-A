name: 'final_project'
version: '1.0.0'
profile: 'final_project'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# The landing volume to read. It comes from the environment, so the same value
# drives the ingestion job and dbt and the two cannot disagree: set LANDING_PATH
# in data/.env and both your own runs and `dbt build` follow it. On the team's
# Airflow it is set for the scheduled run.
#
# Your own runs should point at your own prefix, so rebuilding a model never
# reads a half-written file somebody else is producing. See the README,
# "Developing locally".
vars:
  landing_path: "{{ env_var('LANDING_PATH', '/Volumes/team_a/landing/prod/events') }}"
  price_enrichment_path: >-
    {{ env_var(
      'PRICE_ENRICHMENT_PATH',
      env_var(
        'LANDING_PATH',
        '/Volumes/team_a/landing/prod/events'
      ) | replace('/events', '/enrichment/prices')
    ) }}

clean-targets:
  - "target"
  - "dbt_packages"

models:
  final_project:
    staging:
      # Staging is materialized as a table because it reads every raw JSON file
      # in the landing folder. The files are scanned once per dbt run, while
      # downstream models and tests query the resulting table.
      +materialized: table
    intermediate:
      # Intermediate models contain reusable business transformations between
      # staging and the backend-facing marts. Views remain easy to inspect
      # without storing another physical copy of the data.
      +materialized: view

    marts:
      +materialized: table
