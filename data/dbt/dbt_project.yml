name: 'final_project'
version: '1.0.0'
profile: 'final_project'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

# The landing volume to read. It comes from the environment, so the same value
# drives the ingestion job and dbt and the two cannot disagree: set LANDING_PATH
# in data/.env and both your own runs and `dbt build` follow it. On the team's
# Airflow it is set for the scheduled run.
#
# Your own runs should point at your own prefix, so rebuilding a model never
# reads a half-written file somebody else is producing. See the README,
# "Developing locally".
vars:
  landing_path: "{{ env_var('LANDING_PATH', '/Volumes/team_a/landing/prod/events') }}"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  final_project:
    staging:
      # Staging is materialized as a table because it reads every raw JSON file
      # in the landing folder. The files are scanned once per dbt run, while
      # downstream models and tests query the resulting table.
      +materialized: table
    intermediate:
      # Views here: intermediate models select from the staging table, not from
      # files, so re-running one is cheap. They cost nothing to store and you
      # can query them while working out why a mart looks wrong. `ephemeral` is
      # the other common choice: it pastes the SQL into whatever selects it,
      # which is tidier in the warehouse but leaves you nothing to inspect when
      # a number is off. While you are learning, being able to select from it
      # is worth more.
      +materialized: view

      # Disabled starter model from the sample job-postings pipeline.
      int_posting_tags:
        +enabled: false

    marts:
      +materialized: table

      # Disabled starter models from the sample job-postings pipeline.

      fct_postings_enriched:
        +enabled: false

      fct_tag_popularity:
        +enabled: false

      # Optional LLM sample model. It remains disabled because the initial
      # Ticketmaster pipeline must not depend on an enrichment API.
      fct_title_discipline:
        +enabled: false
        +secret_scope: team_a  # your catalog name: team_b, team_c, team_d
