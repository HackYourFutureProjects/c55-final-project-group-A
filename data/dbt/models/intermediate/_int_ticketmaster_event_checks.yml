version: 2

models:
  - name: int_ticketmaster_event_checks
    description: >
      Latest source records with listing checks evaluated once per build.
      Both event processing and health metrics use these stored results.
    columns:
      - name: event_id
        tests:
          - not_null
          - unique

      - name: checks_date
        tests:
          - not_null

      - name: checks_evaluated_at
        tests:
          - not_null

      - name: passes_date_status_checks
        tests:
          - not_null

      - name: passes_parking_check
        tests:
          - not_null

      - name: passes_ticket_extras_check
        tests:
          - not_null
