version: 2

models:
  - name: int_event_price_enrichment
    description: >
      Latest deterministic price-enrichment result for each Ticketmaster
      occurrence ID, combining the separately staged Ticketmaster internal
      and Universe GraphQL provider datasets.

    columns:
      - name: event_id
        description: Ticketmaster occurrence ID associated with the source listing.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ticketmaster_events')
                field: event_id

      - name: price_provider
        description: Provider from which the listing price was extracted.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ticketmaster
                  - universe

      - name: listing_key
        description: Provider-specific identifier used to request the listing price.
        tests:
          - not_null

      - name: normalized_source_url
        description: Source listing URL without referral query parameters.
        tests:
          - not_null

      - name: price_min
        description: >
          Minimum current advertised price including known service fees.
          NULL means that a price was unavailable and does not mean free.

      - name: price_max
        description: >
          Maximum current advertised price including known service fees.
          NULL when a price was unavailable.

      - name: currency
        description: Three-letter currency code when a price is known.

      - name: is_price_known
        description: >
          True when a complete valid price range and currency were extracted.
        tests:
          - not_null

      - name: age_limit
        description: Age restriction supplied by the price provider when available.

      - name: extraction_status
        description: Whether the latest deterministic extraction succeeded or failed.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - success
                  - failed

      - name: extraction_method
        description: Deterministic provider-specific extraction method.
        tests:
          - not_null

      - name: error_code
        description: >
          Monitoring code explaining a failed request or an unavailable price.
          NULL when extraction returned a known price.

      - name: extracted_at
        description: UTC timestamp at which ingestion attempted the extraction.
        tests:
          - not_null

      - name: ingest_date
        description: Date partition of the enrichment landing file.
        tests:
          - not_null

      - name: source_file
        description: Landing file from which the enrichment record was read.
        tests:
          - not_null

      - name: landed_at
        description: Modification timestamp of the selected landing file.
        tests:
          - not_null
