version: 2

models:
  - name: fct_event_attributes
    description: >
      Incremental LLM enrichment containing one row per logical external event.
      Identical classification inputs reuse the same result. This model is not
      yet part of the backend publishing contract.
    columns:
      - name: logical_event_id
        description: >
          Stable logical event UUID matching fct_external_events.
        tests:
          - unique
          - not_null

      - name: input_fingerprint
        description: >
          SHA-256 fingerprint of the event information supplied to the LLM.
          Multiple logical events may share the same fingerprint and result.
        tests:
          - not_null

      - name: venue_setting
        description: >
          Whether the event takes place indoors, outdoors, in both settings,
          or cannot be determined from the supplied information.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - indoor
                  - outdoor
                  - mixed
                  - unknown

      - name: enriched_at
        description: >
          Timestamp when this logical event enrichment row was last inserted
          or updated.
        tests:
          - not_null
