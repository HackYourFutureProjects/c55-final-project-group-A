version: 2

models:
  - name: fct_external_events_enriched
    description: >
      Backend-facing logical external events with an inferred venue setting.
      Preserves all columns and rows from fct_external_events.
    columns:
      - name: logical_event_id
        tests:
          - unique
          - not_null

      - name: venue_setting
        description: >
          Inferred event setting, not a guarantee from the organizer.
          Unknown means the available information is insufficient.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - indoor
                  - outdoor
                  - mixed
                  - unknown
