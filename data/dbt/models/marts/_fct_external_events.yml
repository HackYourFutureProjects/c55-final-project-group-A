version: 2

models:
  - name: fct_external_events
    description: >
      One row represents one logical Ticketmaster event per venue and local
      date, represented by its earliest eligible occurrence. This model is the
      backend-facing contract intended for publication to PostgreSQL.
      Renaming, removing or changing the type of a column must be agreed with
      the backend team.
    columns:
      - name: external_event_key
        description: >
          Source-qualified Ticketmaster ID of the earliest occurrence selected to
          represent the logical daily event.
        tests:
          - unique
          - not_null

      - name: external_event_id
        description: >
          Ticketmaster ID of the earliest occurrence selected to represent the
          logical daily event.
        tests:
          - not_null

      - name: source
        description: External system from which the event was obtained.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ticketmaster

      - name: is_published
        description: >
          True for events present in the current dbt mart. The publisher may
          retain previously published events with active Saved or Going
          references and mark those retained rows as false.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - true

      - name: title
        description: Event title supplied by Ticketmaster.
        tests:
          - not_null

      - name: description
        description: >
          Event description supplied by Ticketmaster. NULL means that the
          source did not provide a usable description.

      - name: source_url
        description: Ticketmaster or partner page where the event can be viewed.
        tests:
          - not_null

      - name: category
        description: >
          Draft normalized category mapped from Ticketmaster classifications.
          The mapping must be agreed with the backend team.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Music
                  - Arts & Culture
                  - Theatre & Performance
                  - Family & Kids
                  - Community & Social
                  - Sports & Fitness
                  - Food & Drink
                  - Other

      - name: categories
        description: >
          Sorted distinct application categories derived from all Ticketmaster
          classifications. Other is used only when no specific category can be
          derived. The scalar category column remains temporarily for backward
          compatibility with the existing backend contract.
        tests:
          - not_null

      - name: source_segment
        description: Original Ticketmaster classification segment.
        tests:
          - not_null

      - name: source_genre
        description: Original Ticketmaster classification genre when available.

      - name: source_subgenre
        description: Original Ticketmaster classification subgenre when available.

      - name: is_family
        description: Whether Ticketmaster marks the event as family-oriented.
        tests:
          - not_null

      - name: start_date
        description: Local calendar date on which the event starts.
        tests:
          - not_null

      - name: start_time
        description: >
          Local start time represented as text. NULL when Ticketmaster has not
          announced an exact time.

      - name: start_at
        description: >
          Exact timestamp of the earliest eligible occurrence selected for the
          logical daily event.
        tests:
          - not_null

      - name: occurrence_count
        description: >
          Number of Ticketmaster occurrence IDs represented by this logical
          daily event. One means that no additional same-day booking slots were
          grouped.
        tests:
          - not_null

      - name: end_at
        description: >
          Exact end timestamp of the selected earliest occurrence when
          supplied by Ticketmaster. NULL when the source does not provide it.

      - name: timezone
        description: Event timezone supplied by Ticketmaster.
        tests:
          - not_null

      - name: status_code
        description: >
          Status of the selected earliest occurrence. Offsale and rescheduled
          events are excluded before this mart is built.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - onsale
                  - cancelled
                  - postponed

      - name: is_cancelled
        description: True when the Ticketmaster status is cancelled.
        tests:
          - not_null

      - name: date_tbd
        description: Whether Ticketmaster marks the event date as undetermined.
        tests:
          - not_null

      - name: date_tba
        description: Whether Ticketmaster marks the event date as to be announced.
        tests:
          - not_null

      - name: time_tba
        description: Whether Ticketmaster marks the start time as to be announced.
        tests:
          - not_null

      - name: no_specific_time
        description: Whether Ticketmaster states that the event has no specific time.
        tests:
          - not_null

      - name: price_min
        description: >
          Minimum current advertised listing price including known service
          fees. Deterministic listing enrichment is preferred, with the
          Ticketmaster Discovery API price range as fallback. Zero means that
          at least one free option is advertised; NULL means unavailable.

      - name: price_max
        description: >
          Maximum current advertised listing price including known service
          fees. The range may include premium or VIP ticket options.

      - name: currency
        description: Three-letter currency code when a complete price is known.

      - name: is_price_known
        description: >
          True when price_min, price_max and currency form a complete valid
          advertised price range.
        tests:
          - not_null

      - name: external_venue_id
        description: Venue identifier assigned by Ticketmaster.

      - name: venue_name
        description: Venue name when supplied by Ticketmaster.

      - name: address_line1
        description: Original venue address supplied by Ticketmaster.
        tests:
          - not_null

      - name: street_name
        description: >
          Parsed street name. If the source address cannot be parsed reliably,
          the complete address_line1 is preserved here.
        tests:
          - not_null

      - name: house_number
        description: >
          Parsed house number stored as a string. NULL when it cannot be
          extracted confidently.

      - name: postal_code
        description: Postal code of the selected venue when available.

      - name: city_name
        description: City of the selected venue.
        tests:
          - not_null

      - name: province
        description: Province or regional name when supplied by Ticketmaster.

      - name: country_code
        description: ISO country code of the selected venue.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - NL

      - name: latitude
        description: Venue latitude in decimal degrees.
        tests:
          - not_null

      - name: longitude
        description: Venue longitude in decimal degrees.
        tests:
          - not_null

      - name: image_url
        description: Selected Ticketmaster image URL for the event.
        tests:
          - not_null

      - name: ingest_date
        description: >
          Date from the ingest_date landing directory. This represents when
          the pipeline saw the event, not when the event takes place.
        tests:
          - not_null

      - name: ingested_at
        description: Modification timestamp of the selected landing file.
        tests:
          - not_null