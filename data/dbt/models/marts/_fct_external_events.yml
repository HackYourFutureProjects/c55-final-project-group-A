version: 2

models:
  - name: fct_external_events
    description: >
      One row represents the latest ingested version of one external
      Ticketmaster event. This model is the draft contract intended for
      publication to PostgreSQL for consumption by the backend. Renaming,
      removing or changing the type of a column must be agreed with the
      backend team.
    columns:
      - name: external_event_key
        description: >
          Stable cross-source identifier consisting of the source name and
          the source event identifier.
        tests:
          - unique
          - not_null

      - name: external_event_id
        description: Event identifier assigned by Ticketmaster.
        tests:
          - not_null

      - name: source
        description: External system from which the event was obtained.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ticketmaster

      - name: title
        description: Event title supplied by Ticketmaster.
        tests:
          - not_null

      - name: description
        description: >
          Event description when supplied by Ticketmaster. NULL means that
          the source did not provide a description.

      - name: source_url
        description: Ticketmaster or partner page where the event can be viewed.
        tests:
          - not_null

      - name: category
        description: >
          Draft normalized category mapped from Ticketmaster classifications.
          The mapping must be agreed with the backend team.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Music
                  - Arts & Culture
                  - Theatre & Performance
                  - Family & Kids
                  - Community & Social
                  - Sports & Fitness
                  - Food & Drink
                  - Other

      - name: source_segment
        description: Original Ticketmaster classification segment.
        tests:
          - not_null

      - name: source_genre
        description: Original Ticketmaster classification genre when available.

      - name: source_subgenre
        description: Original Ticketmaster classification subgenre when available.

      - name: is_family
        description: Whether Ticketmaster marks the event as family-oriented.
        tests:
          - not_null

      - name: start_date
        description: Local calendar date on which the event starts.
        tests:
          - not_null

      - name: start_time
        description: >
          Local start time represented as text. NULL when Ticketmaster has not
          announced an exact time.

      - name: start_at
        description: >
          Exact start timestamp. NULL when Ticketmaster marks the event time
          as to be announced.

      - name: end_at
        description: >
          Exact end timestamp when supplied by Ticketmaster. Many events do
          not provide an end timestamp.

      - name: timezone
        description: Event timezone supplied by Ticketmaster.
        tests:
          - not_null

      - name: status_code
        description: Current Ticketmaster sales or scheduling status.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - onsale
                  - offsale
                  - rescheduled
                  - cancelled
                  - postponed

      - name: is_cancelled
        description: True when the Ticketmaster status is cancelled.
        tests:
          - not_null

      - name: date_tbd
        description: Whether Ticketmaster marks the event date as undetermined.
        tests:
          - not_null

      - name: date_tba
        description: Whether Ticketmaster marks the event date as to be announced.
        tests:
          - not_null

      - name: time_tba
        description: Whether Ticketmaster marks the start time as to be announced.
        tests:
          - not_null

      - name: no_specific_time
        description: Whether Ticketmaster states that the event has no specific time.
        tests:
          - not_null

      - name: price_min
        description: >
          Minimum advertised price when supplied. NULL means unavailable and
          does not mean that the event is free.

      - name: price_max
        description: Maximum advertised price when supplied.

      - name: currency
        description: Currency of the advertised price range when supplied.

      - name: is_price_known
        description: True when Ticketmaster supplied a minimum price.
        tests:
          - not_null

      - name: external_venue_id
        description: Venue identifier assigned by Ticketmaster.

      - name: venue_name
        description: Venue name when supplied by Ticketmaster.

      - name: address_line1
        description: First address line of the selected venue when available.

      - name: postal_code
        description: Postal code of the selected venue when available.

      - name: city_name
        description: City of the selected venue.
        tests:
          - not_null

      - name: province
        description: Province or regional name when supplied by Ticketmaster.

      - name: country_code
        description: ISO country code of the selected venue.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - NL

      - name: latitude
        description: Venue latitude in decimal degrees.
        tests:
          - not_null

      - name: longitude
        description: Venue longitude in decimal degrees.
        tests:
          - not_null

      - name: image_url
        description: Selected Ticketmaster image URL for the event.
        tests:
          - not_null

      - name: ingest_date
        description: >
          Date from the ingest_date landing directory. This represents when
          the pipeline saw the event, not when the event takes place.
        tests:
          - not_null

      - name: ingested_at
        description: Modification timestamp of the selected landing file.
        tests:
          - not_null