version: 2

models:
  - name: stg_ticketmaster_events
    description: Cleaned Ticketmaster events, one row per event, keeping the most recently
      ingested version.
    columns:
      - name: event_id
        description: Unique event identifier assigned by Ticketmaster.
        tests: [unique, not_null]

      - name: event_name
        description: Event name supplied by Ticketmaster.
        tests: [not_null]

      - name: start_date
        description: Local calendar date on which the event starts.
        tests: [not_null]

      - name: start_at
        description: Exact event start timestamp. This is NULL when Ticketmaster marks the event time as to be announced.

      - name: end_at
        description: Exact event end timestamp when supplied by Ticketmaster. Many events do not provide an end time.

      - name: timezone
        description: Event timezone supplied by Ticketmaster.
        tests: [not_null]

      - name: status_code
        description: Ticketmaster sales or scheduling status.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - onsale
                  - offsale
                  - rescheduled
                  - cancelled
                  - postponed

      - name: segment_name
        description: >
          Segment from the primary Ticketmaster classification, falling back
          to the first classification when no primary value is marked.
        tests: [not_null]

      - name: city_name
        description: City of the selected venue.
        tests: [not_null]

      - name: country_code
        description: ISO country code of the selected venue.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [NL]

      - name: latitude
        description: Venue latitude converted to decimal.
        tests: [not_null]

      - name: longitude
        description: Venue longitude converted to decimal.
        tests: [not_null]

      - name: image_url
        description: First Ticketmaster image URL selected for the event.
        tests: [not_null]

      - name: price_min
        description: >
          Minimum advertised price when supplied. NULL means that Ticketmaster
          did not provide a price and does not mean that the event is free.

      - name: price_max
        description: Maximum advertised price when supplied.

      - name: currency
        description: Currency of the advertised price range when supplied.

      - name: source
        description: External source from which the event was obtained.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ticketmaster]

      - name: source_file
        description: Landing file from which this event version was read.
        tests: [not_null]

      - name: ingest_date
        description: >
          The date from the `ingest_date=<date>` landing directory. This is
          when the pipeline saw the event, not when the event takes place.
        tests: [not_null]

      - name: ingested_at
        description: Modification timestamp of the selected landing file.
        tests: [not_null]
